server:
  port: 8080

sayad:
  api:
    base-url: http://localhost:8081/sayad

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:chequedb
    driverClassName: org.h2.Driver
    username: sa
    password: dbpassword

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2

